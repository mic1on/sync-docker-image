name: Copy Docker Image
run-name: Copy ${{ inputs.source_image }} to ${{ inputs.destination_image }}
on: 
  workflow_dispatch:
    inputs:
      source_image:
        description: '原始 Image (格式 registry/repo:tag)'
        required: true
        default: 'ghcr.io/mic1on/onestep-control-plane:latest'
      destination_image:
        description: '目标 Image (格式 registry/repo:tag)'
        required: true
        default: 'registry.cn-shanghai.aliyuncs.com/ceeg/onestep-control-plane:latest'

jobs:
  copy:
    runs-on: ubuntu-latest
    steps:
    - name: Parse Docker Images
      id: images
      shell: bash
      env:
        SOURCE_IMAGE: ${{ github.event.inputs.source_image }}
        DESTINATION_IMAGE: ${{ github.event.inputs.destination_image }}
      run: |
        set -euo pipefail

        parse_image() {
          local name="$1"
          local image="$2"

          if [[ -z "$image" || "$image" != */* ]]; then
            echo "::error::${name} must use registry/repo:tag format"
            exit 1
          fi

          local registry="${image%%/*}"
          local repo="${image#*/}"
          local repo_name="${repo##*/}"

          if [[ -z "$registry" || -z "$repo" || "$repo_name" != *:* ]]; then
            echo "::error::${name} must use registry/repo:tag format"
            exit 1
          fi

          {
            echo "${name}_registry=${registry}"
            echo "${name}_repo=${repo}"
          } >> "$GITHUB_OUTPUT"
        }

        parse_image "source" "$SOURCE_IMAGE"
        parse_image "destination" "$DESTINATION_IMAGE"

    - name: Copy Docker Images
      uses: ikrong/docker-sync-action@main
      with:
        source: ${{ steps.images.outputs.source_registry }}
        source-credential: ${{ secrets.SOURCE_CREDENTIAL }}
        destination: ${{ steps.images.outputs.destination_registry }}
        destination-credential: ${{ secrets.DESTINATION_CREDENTIAL }}
        copy: "${{ steps.images.outputs.source_repo }} ${{ steps.images.outputs.destination_repo }}"
